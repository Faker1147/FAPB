//加一个T    "yapb addbot 100 3 1"
//加一个CT"  "yapb addbot 100 4 2"

// 
// 默认值: 50
yb_followpercent "39"

// 进入一个玩家时，退出一个Bot
// 默认值: 0
yb_autovacate "1"

// 开始服务器时，自动添加Bot的数量
// 默认值: 10
yb_quota "0"

// 当Bot随机创建时，Bot最小技能
// 默认值: 95
yb_minskill "95"

// 当BOT随机创建时，Bot最大技能
// 默认值: 100
yb_maxskill "100"

// 经验系统的危险数值，高值导致更多的战术
// 默认值: 800
yb_dangerfactor "2000"

// 确定多少Bot跟随玩家，听从玩家无线电指令
// 默认值: 3
yb_followuser "2"
.
// 确定Bot对听声分辨的最大反应时间(秒)
// 默认值: 0.5
yb_timersound "0.01"

// 确定Bot对捡枪的最大反应时间(秒)
// 默认值: 0.2
yb_timerpickup "0.01"

// 确定Bot对扔雷的最大反应时间(秒)
// 默认值: 0.5
yb_timergrenade "0.01"

// Bot是否聊天
// 默认值: 1
yb_chat "0"

// 确定BotDll能够从halflife引擎获取建议
// 默认值: 1
yb_synth "1"

// Bot刀战模式
// 默认值: 0
yb_knifemode "0"

// 在Bot创建后是否在其姓名后加上其技能值，若设置yb_nameprefix，则此参数无效
// 默认值: 0
yb_skilltags "0"

// 是否暂停Bot活动
// 默认值: 0
yb_stopbots "0"

// Bot能否开枪穿墙
// 默认值: 1
yb_thruwalls "1"

// Bot是否可以喷图
// 默认值: 1
yb_spraypaints "1"

// 
// 默认值: 1
yb_botbuy "1"

// 调试，Bot的纠错功能
// 默认值: 0
yb_debug "0"

// 是否对Bot的团队杀手惩罚
// 默认值: 1
yb_tkpunish "1"

// Bot是否可以走路走路(慢走)
// 默认值: 1
yb_walkallow "1"

// Specifies if bots are able to shoot their enemies.
// Bot是否禁止攻击(但攻击队友还是会被反击)
// 默认值: 0
yb_noshots "0"

//
// 默认值: 1
yb_hardmode "1"

//
// 默认值: 1
yb_ecorounds "1"

// Bot名字前缀
// 默认值: 
yb_nameprefix "Yapb |"

// Bot菜单、指挥、调用口令
// 默认值: 0
yb_password_key "_ybpw"

// 服务器运行Bot的口令
// 默认值: 0
yb_password "thebot"

// Bot语音路径
// 默认值: sound/radio/bot
yb_chatterpath "sound/radio/bot"

// Bot禁用武器列表，包括购买和拾取
// 默认值: ump45;p90;elite;tmp;mac10;m3;xm1014
yb_restrictweapons "mac10;tmp;ump45;xm1014;m3;scout"

//
// 默认值: 3
yb_aimtype "3"

//
// 默认值: 0
yb_msectype "0"

//
// 默认值: 2
yb_loglevel "2"

// Specifies csdm gameplay mode.
// 设置为 2 在CSDM模式下，可以攻击全部人
// 默认值: 0
yb_csdmplay "0"

// 语言设置(chs中文，en英文)
// 默认值: en
yb_language "chs"

//
// 默认值: 2
yb_commtype "2"

// Bot加入的团队(T,CT,ANY)
// 默认值: any
yb_forceteam "any"

// yapb菜单
bind "=" "yapb menu"
//yapb 控制命令
bind "-"  "yapb cmenu"
